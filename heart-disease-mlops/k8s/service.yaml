# LoadBalancer: on Docker Desktop this is published on http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-api
  labels:
    app: heart-api
spec:
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - name: http
      port: 8080
      targetPort: http
